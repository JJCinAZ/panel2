<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@0,400;0,700;0,900;1,400&amp;family=Public+Sans:wght@400;700;900&amp;family=Inter:wght@400;700&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <style>
        :root {
            --primary: #000000;
            --white: #ffffff;
            --gray-light: #e2e2e2;
            --gray-border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f9f9f9;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Public Sans', sans-serif;
        }

        .e-ink-canvas {
            width: 800px;
            height: 480px;
            background-color: var(--white);
            border: 2px solid var(--primary);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 25%;
            background-color: var(--primary);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 48px 0;
            position: relative;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .sidebar-brand {
            font-family: 'Noto Serif', serif;
            font-size: 24px;
        }

        .sidebar-subbrand {
            font-family: 'Public Sans', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: -0.05em;
            font-size: 12px;
        }

        .suite-number-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suite-number {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Noto Serif', serif;
            font-weight: 900;
            font-size: 128px;
            letter-spacing: 0.1em;
        }

        .sidebar-spacer {
            height: 48px;
        }

        /* Main Content Styles */
        .main-content {
            width: 75%;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 32px;
        }

        .separator {
            width: 66.666667%;
            height: 2px;
            background-color: var(--primary);
            margin-bottom: 48px;
        }

        .tenant-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 96px;
        }

        .tenant-name {
            font-family: 'Noto Serif', serif;
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            color: var(--primary);
        }

        .tenant-details {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .accent-bar {
            height: 10px;
            width: 40px;
            background-color: var(--primary);
        }

        .tenant-subtitle {
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 14px;
            font-weight: 700;
        }

        /* Decorative Corner Accents */
        .corner-accent {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--primary);
            border-style: solid;
            border-width: 0;
        }

        .top-right {
            top: 16px;
            right: 16px;
            border-top-width: 2px;
            border-right-width: 2px;
        }

        .bottom-right {
            bottom: 16px;
            right: 16px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: var(--primary);
        }
    </style>
</head>
<body>
<main class="e-ink-canvas">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-brand">SABINO<br/>EXECUTIVE<br/>SUITES</span>
        </div>
        <div class="suite-number-container">
            <h1 class="suite-number">{{ .SuiteNumber }}</h1>
        </div>
    </aside>
    <!-- MAIN CONTENT -->
    <section class="main-content">
        <header class="header-actions">
            <span class="material-symbols-outlined">more_vert</span>
        </header>
        <div class="separator"></div>
        <div class="tenant-info">
            <h2 class="tenant-name">{{ .TenantName }}</h2>
            {{ if .TenantSubtitle }}
            <div class="tenant-details">
                <span class="accent-bar"></span>
                <span class="tenant-subtitle">{{ .TenantSubtitle }}</span>
            </div>
            {{ end }}
        </div>
        <!-- Architectural Accents -->
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-right"></div>
    </section>
</main>
</body>
</html>
